name: check-build-test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: hustcer/setup-moonbit@v1
        with:
          version: '0.10.16+b1a0e846e'
          core-version: '0.10.16+b1a0e846e'
      - name: Windows compiler paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./tools/windows/build-shim.ps1
          $shim = Join-Path $PWD '_build/windows-path-shims'
          foreach ($tool in @('MOONC', 'MOONFMT', 'MOONINFO', 'MOONDOC')) {
            $toolPath = Join-Path $shim "$($tool.ToLower()).exe"
            "${tool}_OVERRIDE=$toolPath" >> $env:GITHUB_ENV
          }
          $env:MOONC_OVERRIDE = Join-Path $shim 'moonc.exe'
          Push-Location (Join-Path $env:USERPROFILE '.moon/lib/core')
          try {
            moon bundle --all --warn-list -a
            if ($LASTEXITCODE -ne 0) { throw 'Core bundle failed' }
          } finally { Pop-Location }
      - name: Resolve dependencies
        run: |
          moon version --all
          moon update
      - name: Check build test
        run: |
          moon check --target all --deny-warn
          moon build --target all --deny-warn
          moon test --target all --deny-warn
      - name: Format and API stability
        run: |
          moon fmt --check
          moon info
          git diff --exit-code
      - name: Verify real scenarios
        run: |
          moon run examples/query_standard --target wasm-gc --deny-warn
          moon run examples/asset_inventory --target native --deny-warn
          moon run examples/catalog_discovery --target native --deny-warn
          moon run examples/research_summary --target native --deny-warn
          moon run examples/scale --target native --release --deny-warn
          moon run cmd/main --target native -- examples/data/catalog.ttl examples/data/catalog.rq json
      - name: Source and publication hygiene
        run: |
          moon package
          python scripts/verify_repository.py

      - name: Independent RDFLib common-profile comparison
        run: |
          python -m pip install -r scripts/requirements-interop.txt
          python scripts/compare_rdflib.py _build/native/debug/build/cmd/main/main.exe

      - name: Pinned W3C query compatibility
        run: python scripts/check_w3c.py _build/native/debug/build/cmd/main/main.exe --fetch

      - name: Local release catalogue integration
        run: moon run examples/compatibility --target native --deny-warn

      - name: November integration scenario
        run: moon run examples/november --target native --deny-warn

      - name: Scoped merge and aligned result union
        run: moon run examples/expansion --target native --deny-warn
